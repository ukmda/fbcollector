# pyproject.toml for building the PYPI library of python code

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fbCollector"
version = "2026.9.0"
description = "Fireball collector and analyser for UKMON and GMN"
readme = "./README.md"
authors = [{ name = "Mark McIntyre", email = "markmcintyre99@googlemail.com" }]
license-files = [ "LICENSE" ]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy"
]
keywords = ["meteors", "ukmon"]
dependencies = [
    "matplotlib",
    "numpy < 2.0",
    "pandas",
    "Pillow",
    "pytz",
    "Shapely",
    "paramiko",
    "scp",
    "pyqtgraph",
    "pdoc",
    "Cython",
    "xmltodict",
    "imageio",
    "scipy",
    "jplephem",
    "pyephem",
    "requests",
    "pyyaml",
    "pyswarms",
    "pkgconfig",
    "ml-dtypes",
    "keras",
    "markdown2",
    "pyqt5; platform_machine != 'aarch64' and platform_machine != 'armv7l'",
    "basemap",
    "basemap-data-hires",
    "pytest",
    "pytest-cov"
]
requires-python = ">=3.12"

[tool.bumpver]
current_version = "2026.9.0"
version_pattern = "YYYY.0M.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"',]
"meteortools/__init__.py" = ['version = "{version}"',]
#"meteortools/README.md" = ["{version}",]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    'ignore:pyproj unable to set database path',
]
