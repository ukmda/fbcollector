name: Build Fireball Analyser
#env:
#  AWS_REGION: eu-west-2
#permissions:
#  id-token: write
#  contents: read

on:
  push:
    branches: [master, dev]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
jobs:
  local_tests:
    name: local test stage
    runs-on: windows-latest
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v7
      - name: testing
        run: |
          pip install -r requirements.txt
          $ENV:PYTHONPATH="$ENV:PYTHONPATH;."
          echo $ENV:PYTHONPATH
          pytest -v ./tests --cov=. --cov-report=term-missing
  build_fbtool:
    name: build fbcollector
    runs-on: windows-latest
    needs: local_tests
    if: github.ref != 'refs/heads/master'
    steps:
      - name: "checkout repository"
        uses: actions/checkout@v7
      - name: make help
        run: |
          pip install markdown2
          markdown2 ./USAGE.md > USAGE.html
          markdown2 ./README.md > README.html
      - name: package
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          command: 'dos2unix *.sh'
          filename: 'fireball_collector.zip'
          exclusions: '*.git* *.vscode* __pycache__ /.vscode .gitignore *.md *.yaml *.spec *.iss *.toml tests  /.pytest*'
  release_fbtool:
    name: release fbcollector
    runs-on: windows-latest
    needs: [local_tests]
    if: github.ref == 'refs/heads/master'
    steps: 
      - name: checkout
        uses: actions/checkout@v7
      - name: make help
        run: |
          pip install markdown2
          markdown2 ./USAGE.md > USAGE.html
          markdown2 ./README.md > README.html
      - name: repackage
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          command: 'dos2unix *.sh'
          filename: 'fireball_collector.zip'
          exclusions: '*.git* *.vscode* __pycache__ /.vscode .gitignore *.md *.yaml *.spec *.iss *.toml tests  /.pytest*'
      - name: release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.UKMDA_MM_PAT }}
        with:
          file: .\fireball_collector.zip
          tags: true
          overwrite: true
          tag_name: 2026.10.1
