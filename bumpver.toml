[bumpver]
current_version = "2025.11.2"
version_pattern = "YYYY.MM.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = true
push = true

[bumpver.file_patterns]
"fireballCollector.py" = [
    'appversion = "{version}"'
]
"README.md" = [
    'Version: {version}',
]
"bumpver.toml" = [
    'current_version = "{version}"',
]
"fireballcollector_setup.iss" = [
    'AppVersion={version}',
]
".github/workflows/build_tools.yml" = [
    'tag_name: {version}',
]

